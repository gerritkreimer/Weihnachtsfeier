<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Weihnachtsessen</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./Icon.png">
  <link rel="apple-touch-icon" href="./Icon.png">
  <meta name="theme-color" content="#1b4332">
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-attachment: fixed;
    }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 1rem); }
    .gold-glow {
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.18);
    }
    .festive-card {
      background: linear-gradient(135deg, rgba(16, 44, 33, 0.85) 0%, rgba(10, 31, 23, 0.92) 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .festive-border {
      border: 1px solid rgba(245, 158, 11, 0.28);
    }
    .festive-border:hover {
      border-color: rgba(245, 158, 11, 0.65);
    }
    @media print {
      body {
        background: #ffffff !important;
        color: #000000 !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      header, main, footer, .fixed, #adminModal, #snowCanvas, #userModal, #itemConfigModal, #cartModal, #successModal, #shopStatusBanner {
        display: none !important;
      }
      #printContainer {
        display: block !important;
        visibility: visible !important;
        position: static !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 12mm 15mm !important;
        box-sizing: border-box !important;
        color: #111827 !important;
      }
      tr {
        page-break-inside: avoid;
      }
      table {
        border-collapse: collapse !important;
        width: 100% !important;
      }
      th, td {
        border: 1px solid #d1d5db !important;
        padding: 6px 8px !important;
      }
      th {
        background-color: #f3f4f6 !important;
        color: #111827 !important;
        font-weight: bold !important;
      }
    }
  </style>
</head>
<body class="bg-gradient-to-b from-[#0a2117] via-[#0f2e21] to-[#071710] text-slate-100 min-h-screen flex flex-col pb-24 select-none relative overflow-x-hidden">
  <!-- Druckbereich für A4-Ausdruck (nur beim Drucken sichtbar) -->
  <div id="printContainer" class="hidden"></div>

  <!-- Animierter Schneefall Canvas (leichtgewichtig, performant & klick-durchlässig) -->
  <canvas id="snowCanvas" class="fixed inset-0 pointer-events-none z-10"></canvas>

  <!-- Header: Festliches Tannengrün & Gold -->
  <header class="bg-gradient-to-r from-emerald-950 via-green-900 to-emerald-950 text-white px-4 py-4 sticky top-0 z-30 shadow-md snow-bg border-b border-amber-500/30">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2.5 cursor-pointer" onclick="handleAdminTrigger()" title="Admin-Bereich öffnen">
        <span class="text-2xl select-none active:scale-125 transition-transform">🎄</span>
        <div>
          <h1 class="text-lg font-black tracking-tight leading-tight flex items-center space-x-1">
            <span>Weihnachtsessen</span>
            <span class="text-amber-300 text-xs font-serif italic">2026</span>
          </h1>
          <p class="text-xs text-emerald-200 flex items-center space-x-1.5">
            <span id="headerEventDate">Essensvorbestellung</span>
            <span id="adminBadge" class="hidden bg-amber-400 text-emerald-950 text-[10px] font-black px-1.5 py-0.2 rounded font-mono">ADMIN</span>
          </p>
        </div>
      </div>
      <div class="flex items-center space-x-1.5">
        <button id="adminHeaderBtn" onclick="openAdminModal()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-2.5 py-1.5 rounded-full text-xs font-black shadow transition flex items-center space-x-1">
          <i data-lucide="shield-check" class="w-3.5 h-3.5"></i>
          <span>Admin</span>
        </button>
        <button onclick="editUserPrompt()" class="bg-emerald-900/80 hover:bg-emerald-800 px-3 py-1.5 rounded-full text-xs font-semibold flex items-center space-x-1 border border-amber-400/40 transition text-amber-100">
          <i data-lucide="user" class="w-3.5 h-3.5"></i>
          <span id="headerUserName">Anmelden</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto w-full px-3 pt-3 flex-1">

    <!-- Status Banner: Dynamische Ampel -->
    <div id="shopStatusBanner" class="mb-3 rounded-2xl p-3.5 flex items-center space-x-3 text-xs shadow-lg border transition-all duration-300 festive-card festive-border text-emerald-100 gold-glow relative z-20">
      <div id="statusDot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping flex-shrink-0"></div>
      <div id="statusBannerText" class="flex-1 font-medium">
        Speisenauswahl für unsere <span class="font-black text-emerald-950">Weihnachtsfeier</span> geöffnet!
      </div>
    </div>

    <!-- Meine aktuelle Bestellung Card (Erscheint nur wenn Bestellung vorliegt) -->
    <div id="userOrderCard" class="hidden mb-3 festive-card border-2 border-amber-400/80 rounded-2xl p-4 shadow-xl gold-glow relative z-20 text-slate-100">
      <div class="flex items-center justify-between pb-2 border-b border-amber-100">
        <div class="flex items-center space-x-1.5 text-emerald-950">
          <i data-lucide="gift" class="w-4 h-4 text-amber-600"></i>
          <span class="text-xs font-black uppercase tracking-wider text-amber-200">Deine Festtags-Auswahl</span>
        </div>
        <span id="userOrderStatusBadge" class="text-[10px] font-black bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full">Gebucht</span>
      </div>

      <div id="userOrderItemsList" class="py-2.5 space-y-1.5 text-xs">
        <!-- Dynamisch befüllt -->
      </div>

      <div class="pt-2 border-t border-amber-100 flex items-center justify-between">
        <div>
          <span class="text-[11px] text-slate-400 font-semibold">Gesamtsumme</span>
          <p id="userOrderTotal" class="text-lg font-black text-amber-300">0,00 €</p>
        </div>
        <button id="btnCancelOrEditOrder" onclick="cancelAndEditOrder()" class="bg-amber-100 hover:bg-amber-200 text-amber-950 font-bold px-3 py-1.5 rounded-xl text-xs flex items-center space-x-1 transition active:scale-95 border border-amber-300">
          <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
          <span>Bestellung anpassen</span>
        </button>
      </div>
      <p id="orderLockNotice" class="hidden text-[10px] text-red-700 font-medium mt-1 text-right">Bestellfenster geschlossen</p>
    </div>

    <!-- Kategorien Tabs -->
    <div class="flex space-x-2 overflow-x-auto no-scrollbar pb-2 pt-1" id="categoryBar">
      <!-- Dynamisch per JS -->
    </div>

    <!-- Speisen Liste -->
    <div class="space-y-2.5 mt-2" id="dishesList">
      <!-- Dynamisch per JS -->
    </div>

  </main>

  <!-- Floating Warenkorb Footer Bar (Festliches Dunkelgrün & Gold) -->
  <div class="fixed bottom-0 left-0 right-0 z-40 bg-[#0a2117]/95 backdrop-blur-md border-t border-amber-400/30 shadow-2xl px-4 py-3 pb-safe">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <button onclick="toggleCartModal(true)" class="flex items-center space-x-3 focus:outline-none">
        <div class="relative bg-gradient-to-br from-emerald-950 to-green-900 text-white p-2.5 rounded-2xl shadow border border-amber-400/50 gold-glow">
          <i data-lucide="shopping-bag" class="w-5 h-5 text-amber-300"></i>
          <span id="cartBadge" class="absolute -top-1.5 -right-1.5 bg-red-600 text-white text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center shadow">0</span>
        </div>
        <div class="text-left">
          <p class="text-xs text-emerald-200/70 font-medium">Dein Festmahl</p>
          <p id="cartTotalSum" class="text-base font-black text-amber-300">0,00 €</p>
        </div>
      </button>

      <button onclick="toggleCartModal(true)" id="btnOpenCart" class="bg-gradient-to-r from-red-700 to-red-800 hover:from-red-800 hover:to-red-900 text-white px-5 py-2.5 rounded-xl font-black text-sm shadow-lg transition flex items-center space-x-1.5 border border-amber-400/40 active:scale-95">
        <span>Auswahl prüfen</span>
        <i data-lucide="chevron-right" class="w-4 h-4 text-amber-300"></i>
      </button>
    </div>
  </div>

  <!-- MODAL: Nutzer Vor- und Nachname erfassen -->
  <div id="userModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl text-left border border-amber-200">
      <div class="flex items-center space-x-3 mb-4">
        <div class="w-10 h-10 bg-emerald-100 text-emerald-900 rounded-2xl flex items-center justify-center font-bold">
          <i data-lucide="user-check" class="w-5 h-5"></i>
        </div>
        <div>
          <h3 class="text-base font-black text-slate-900 leading-tight">Wer bestellt?</h3>
          <p class="text-xs text-slate-500">Für die Vorbestellungsliste</p>
        </div>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Vorname <span class="text-slate-400 font-normal lowercase">(z. B. Santa)</span></label>
          <input type="text" id="inputFirstName" placeholder="Vorname eingeben" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm font-semibold text-slate-800 focus:outline-none focus:border-emerald-600 focus:bg-white transition">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Nachname <span class="text-slate-400 font-normal lowercase">(z. B. Claus)</span></label>
          <input type="text" id="inputLastName" placeholder="Nachname eingeben" class="w-
